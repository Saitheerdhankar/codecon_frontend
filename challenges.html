<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CodeCon - Challenges</title>
  <style>
    /* [Your existing CSS styles here] */
  </style>
</head>
<body>
  <nav>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="challenges.html">Challenges</a>
      <a href="compiler.html">Compiler</a>
      <a href="courses.html">Courses</a>
      <a href="subscription.html">Subscription</a>
      <a href="profile.html">Profile</a>
    </div>
    <a class="login-btn" href="login.html">Login</a>
  </nav>

  <div class="container">
    <h1>Coding Challenges</h1>
    <div class="challenge-list" id="challenge-list">
      <!-- Challenges will be dynamically loaded here -->
    </div>
  </div>

  <!-- AI Assistant -->
  <div class="ai-assistant">
    <div class="ai-chatbox" id="bepo-chat">
      <p><strong>Bepo:</strong> Ask me about your weak areas, and I’ll recommend challenges & courses!</p>
      <textarea placeholder="Ask me anything..." id="bepo-input"></textarea>
      <button id="ask-bepo">Ask Bepo</button>
    </div>
    <div class="ai-icon" id="bepo-icon" title="Talk to Bepo">
      <div class="eye-container">
        <div class="eye"><div class="pupil"></div></div>
        <div class="eye"><div class="pupil"></div></div>
      </div>
      <div class="smile"></div>
    </div>
  </div>

  <script>
    // Function to fetch challenges from the API
    async function fetchChallenges() {
      try {
        const response = await fetch('https://your-api-endpoint.com/api/challenges'); // Replace with actual endpoint
        const challenges = await response.json();
        const challengeList = document.getElementById('challenge-list');

        challenges.forEach(challenge => {
          const card = document.createElement('div');
          card.className = 'challenge-card';
          card.innerHTML = `
            <h3>${challenge.title}</h3>
            <p>${challenge.description}</p>
          `;
          challengeList.appendChild(card);
        });
      } catch (error) {
        console.error('Error fetching challenges:', error);
      }
    }

    // Function to handle Bepo AI assistant
    async function handleBepoQuery() {
      const input = document.getElementById('bepo-input').value.trim();
      if (!input) return;

      try {
        const response = await fetch('https://your-api-endpoint.com/api/bepo/ask', { // Replace with actual endpoint
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ message: input })
        });
        const data = await response.json();
        alert("Bepo says: " + data.reply);
      } catch (error) {
        alert("Something went wrong. Please try again later.");
      }
    }

    // Event listeners
    document.getElementById('bepo-icon').addEventListener('click', () => {
      const chatbox = document.getElementById('bepo-chat');
      chatbox.style.display = chatbox.style.display === 'flex' ? 'none' : 'flex';
    });

    document.getElementById('ask-bepo').addEventListener('click', handleBepoQuery);

    // Initialize
    fetchChallenges();
  </script>
</body>
</html>
