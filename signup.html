<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign Up - CodeCon</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .signup-container {
      background: #fff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      animation: fadeIn 0.8s ease-in-out;
      text-align: center;
    }

    h2 {
      color: #00b894;
      margin-bottom: 24px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
      outline: none;
      background-color: #fff;
      color: #333;
    }

    input::placeholder {
      color: #aaa;
    }

    .signup-btn {
      width: 100%;
      background-color: #00b894;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s;
    }

    .signup-btn:hover {
      background-color: #019875;
    }

    .link {
      margin-top: 15px;
      font-size: 14px;
    }

    .link a {
      color: #00b894;
      text-decoration: none;
    }

    .link a:hover {
      text-decoration: underline;
    }

    .error, .success {
      margin-top: 10px;
      font-size: 14px;
      text-align: center;
      padding: 8px;
      border-radius: 6px;
    }

    .error {
      background-color: #ffe5e5;
      color: #d8000c;
      border: 1px solid #d8000c;
    }

    .success {
      background-color: #e6ffed;
      color: #2e7d32;
      border: 1px solid #2e7d32;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="signup-container">
    <h2>Create Your CodeCon Account</h2>
    <form id="signupForm">
      <input type="text" id="name" placeholder="Full Name" required />
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit" class="signup-btn">Sign Up</button>
    </form>
    <div class="error" id="errorMsg" style="display: none;"></div>
    <div class="success" id="successMsg" style="display: none;"></div>
    <div class="link">Already have an account? <a href="login.html">Login</a></div>
  </div>

  <script>
    const form = document.getElementById('signupForm');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';

      try {
        const response = await fetch('https://your-api-url/api/auth/signup', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ name, email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          errorMsg.textContent = data.message || 'Signup failed';
          errorMsg.style.display = 'block';
        } else {
          successMsg.textContent = 'Signup successful! Please log in.';
          successMsg.style.display = 'block';
          form.reset();
        }
      } catch (error) {
        errorMsg.textContent = 'An error occurred. Please try again.';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
