<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign Up - CodeCon</title>
  <style>
    /* Add your existing styles here */
  </style>
</head>
<body>
  <div class="signup-container">
    <h2>Create Your CodeCon Account</h2>
    <form id="signupForm">
      <input type="text" id="name" placeholder="Full Name" required />
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Sign Up</button>
    </form>
    <div class="error" id="errorMsg"></div>
    <div class="success" id="successMsg"></div>
    <div class="link">Already have an account? <a href="login.html">Login</a></div>
  </div>

  <script>
    const form = document.getElementById('signupForm');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      errorMsg.textContent = '';
      successMsg.textContent = '';

      try {
        const response = await fetch('https://your-api-url/api/auth/signup', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ name, email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          errorMsg.textContent = data.message || 'Signup failed';
        } else {
          successMsg.textContent = 'Signup successful! Please log in.';
          form.reset();
        }
      } catch (error) {
        errorMsg.textContent = 'An error occurred. Please try again.';
      }
    });
  </script>
</body>
</html>
